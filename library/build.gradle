

plugins {
    id 'com.android.library'
}

android {
    namespace 'aman.taglib'
    compileSdk 33
    ndkVersion '29.0.14033849'

    defaultConfig {
        minSdk 23
        targetSdk 33
        ndk { abiFilters 'arm64-v8a' }
        
        
        externalNativeBuild {
            cmake {
                // FORCE RTTI: Required for dynamic_cast to work!
                cppFlags "-frtti -fexceptions" 
            }
        }
        
        
        
    }

    buildTypes {
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake { 
            path "CMakeLists.txt" 
            version '4.1.2'
        }
    }
    
    
    
    
    


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {}






