plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'aman.taglib'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        minSdk 23
        targetSdk 36
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        
        externalNativeBuild {
            cmake {
                // Required for dynamic_cast in TagLibJNI
                cppFlags "-frtti -fexceptions -O3 -flto=thin -fvisibility=hidden -fvisibility-inlines-hidden -ffunction-sections -fdata-sections"
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_ARM_NEON=TRUE", "-DCMAKE_SUPPRESS_REGENERATION=TRUE"
            }
        }
    }

    buildTypes {
        release { 
            minifyEnabled false 
        }
    }

    externalNativeBuild {
        cmake { 
            path "CMakeLists.txt" 
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {}

mavenPublishing {
    coordinates("io.github.amanrajaryan", "TagLib", "1.0.2")

    pom {
        name.set("TagLib")
        description.set("A tag library for Android.")
        inceptionYear.set("2026")
        url.set("https://github.com/AmanRajAryan/AndroidTagLib") 

        licenses {
            license {
                name.set("The Apache License, Version 2.0")
                url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                distribution.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
            }
        }
        developers {
            developer {
                id.set("AmanRajAryan") 
                name.set("Aman Raj Aryan")
                url.set("https://github.com/AmanRajAryan")
            }
        }
        scm {
            url.set("https://github.com/AmanRajAryan/AndroidTagLib")
            connection.set("scm:git:git://github.com/AmanRajAryan/AndroidTagLib.git")
            developerConnection.set("scm:git:ssh://git@github.com/AmanRajAryan/AndroidTagLib.git")
        }
    }

    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
}
