plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'aman.taglib'
    compileSdk 33
    ndkVersion '29.0.14033849'

    defaultConfig {
        minSdk 23
        targetSdk 33
        ndk { abiFilters 'arm64-v8a' }
        
        externalNativeBuild {
            cmake {
                // FORCE RTTI: Required for dynamic_cast to work!
                cppFlags "-frtti -fexceptions" 
            }
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake { 
            path "CMakeLists.txt" 
            version '4.1.2'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {}

mavenPublishing {
    coordinates("io.github.amanrajaryan", "TagLib", "1.0.0")

    pom {
        name.set("TagLib")
        description.set("A tag library for Android.")
        inceptionYear.set("2026")
        url.set("https://github.com/AmanRajAryan/AndroidTagLib") 

        licenses {
            license {
                name.set("The Apache License, Version 2.0")
                url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                distribution.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
            }
        }
        developers {
            developer {
                id.set("AmanRajAryan") 
                name.set("Aman Raj Aryan")
                url.set("https://github.com/AmanRajAryan")
            }
        }
        scm {
            url.set("https://github.com/AmanRajAryan/AndroidTagLib")
            connection.set("scm:git:git://github.com/AmanRajAryan/AndroidTagLib.git")
            developerConnection.set("scm:git:ssh://git@github.com/AmanRajAryan/AndroidTagLib.git")
        }
    }

    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
}
