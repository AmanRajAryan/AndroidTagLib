name: Update Submodule

on:
  workflow_dispatch:      # manual trigger
  schedule:
    - cron: '0 0 * * 0'  # optional: run weekly

jobs:
  update-submodule:
    runs-on: ubuntu-latest

    steps:
      # Checkout the main repository with submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0  # required for pushing

      # Configure Git
      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Update the submodule to the latest commit on main branch
      - name: Update opusfile submodule
        run: |
          cd library/jni/opusfile-0.12
          git fetch origin
          git checkout main       # or master
          git pull
          cd ../../..
          git add library/jni/opusfile-0.12
          
          # Only commit if there is a change
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update opusfile-0.12 submodule to latest commit"
            git push origin HEAD
          else
            echo "Submodule already up-to-date"
          fi
