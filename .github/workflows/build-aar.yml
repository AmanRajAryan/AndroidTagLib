name: Android Build

on:
  push:
    branches: [ main , test ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0


      - name: Update git submodules
        run: git submodule update --init --recursive

      - name: Clean and update submodules
        run: |
          git submodule deinit -f --all
          git submodule update --init --recursive --force --checkout
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          find . -name '*.cmake' -exec dos2unix {} +

      - name: print CMakeLists
        run: cat library/jni/opusfile-0.12/CMakeLists.txt

      - name: install utfcpp
        run: sudo apt-get install -y  libutfcpp-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "NDK installed"

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      


      - name: git submodules
        run: git submodule update --init

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aar
            app/build/outputs/**/*.aab
